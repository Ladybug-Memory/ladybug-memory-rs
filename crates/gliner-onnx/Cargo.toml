[package]
name = "gliner-onnx"
version = "0.1.0"
description = "Native Rust inference for DanKau/gliner2.5-base-v1-onnx (GLiNER2.5 boundary architecture): entity extraction with no Python at inference time"
edition.workspace = true
license.workspace = true

[dependencies]
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
tokenizers = "0.22"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
ndarray = "0.17"

[dev-dependencies]
serde_json = "1.0"
