[package]
name = "gliner-onnx"
version = "0.1.0"
description = "Native Rust inference for nicolasembleton/gliner2.5-base-v1-onnx (GLiNER2.5 boundary architecture): entity extraction with no Python at inference time"
edition.workspace = true
license.workspace = true

[dependencies]
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
# No `esaxx_fast` (default): its C++ (`esaxx-rs` with hardcoded /MT) breaks
# the Windows link against the /MD `lbug` shared-lib shim (LNK2038), and it
# only accelerates the unigram *trainer* — inference is unaffected.
# `onig` is kept: tokenizers requires one of `onig`/`fancy-regex`.
tokenizers = { version = "0.22", default-features = false, features = ["onig", "progressbar"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
ndarray = "0.17"

[dev-dependencies]
serde_json = "1.0"
