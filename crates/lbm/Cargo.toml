[package]
name = "lbm"
version = "0.1.0"
description = "CLI for pi-agent long-term memory over LadybugDB (JSON I/O for pi extensions, human text by default)"
edition.workspace = true
license.workspace = true

[[bin]]
name = "lbm"
path = "src/main.rs"

[dependencies]
lb-memory.path = "../lb-memory"
demo.path = "../demo"
anyhow = "1.0"
serde_json = "1.0"
clap = { version = "4", features = ["derive", "env"] }
