[package]
name = "lb-memory"
version = "0.1.0"
description = "Pi-agent long-term memory over LadybugDB: GLiNER2.5 entity graph over distilled facts (no session duplication)"
edition.workspace = true
license.workspace = true

[dependencies]
gliner-onnx.path = "../gliner-onnx"
lbug.version = "0.21.2"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
time = { version = "0.3", features = ["formatting", "parsing"] }

[dev-dependencies]
tempfile = "3"

[features]
test-support = []
